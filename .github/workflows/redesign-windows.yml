name: Redesign Windows build

# Cross-builds VLC (with the redesigned Qt UI) for Windows x64 and uploads a portable zip.
# The second job runs the portable build on a Windows runner and uploads screenshots of it.
on:
  # The file only runs from the default branch via workflow_dispatch, so also run on pushes
  # that touch this file; edit it (e.g. bump the revision below) to re-run.
  push:
    branches: [redesign]
    paths: ['.github/workflows/redesign-windows.yml']
  workflow_dispatch:

# revision: 6
jobs:
  win64:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: registry.videolan.org/vlc-debian-win64-posix:20260611225331
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # The prebuilt contrib URL 404s, so contribs build from source (about an hour); cache the result.
      - name: Restore contrib cache
        id: contribcache
        uses: actions/cache/restore@v4
        with:
          path: |
            contrib/contrib-win64
            contrib/x86_64-w64-mingw32
            contrib/tarballs
            contrib/python-venv
            extras/tools
          key: win64-contrib-v2-${{ hashFiles('contrib/src/**', 'extras/package/win32/build.sh') }}

      # The restored files keep their old mtimes, so make thinks every contrib is older than the freshly
      # checked-out sources and rebuilds all of them. Make them newer than the checkout.
      - name: Refresh contrib timestamps
        if: steps.contribcache.outputs.cache-hit == 'true'
        run: |
          find contrib/contrib-win64 contrib/x86_64-w64-mingw32 contrib/tarballs contrib/python-venv extras/tools -exec touch {} + 2>/dev/null || true

      - name: Build (release)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          extras/package/win32/build.sh -r -a x86_64 -p

      # Save right after the build so a later packaging failure does not throw away the contribs.
      - name: Save contrib cache
        if: success() && steps.contribcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            contrib/contrib-win64
            contrib/x86_64-w64-mingw32
            contrib/tarballs
            contrib/python-venv
            extras/tools
          key: win64-contrib-v2-${{ hashFiles('contrib/src/**', 'extras/package/win32/build.sh') }}

      - name: Package portable zip
        run: |
          # build.sh names the build directory after the short arch (win64), find it instead of guessing
          BUILD=$(dirname "$(find . -maxdepth 2 -name config.status -path './win*' | head -1)")
          echo "build dir: $BUILD"
          make -C "$BUILD" package-win32-zip
          mkdir -p out
          cp -v "$BUILD"/vlc-*-win*.zip out/
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vlc-win64-portable
          path: out/
          retention-days: 14

  shots:
    needs: win64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vlc-win64-portable
          path: dl

      - name: Unpack
        shell: pwsh
        run: |
          Get-ChildItem dl
          Expand-Archive (Get-ChildItem dl -Filter *.zip | Select-Object -First 1).FullName -DestinationPath app
          Get-ChildItem app

      - name: Screenshots
        shell: pwsh
        run: |
          $dir = (Get-ChildItem app -Directory | Select-Object -First 1).FullName
          .github/scripts/win-shots.ps1 $dir "$PWD/shots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: shots/
          retention-days: 14

