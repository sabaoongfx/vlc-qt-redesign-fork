name: Redesign Windows build

# Cross-builds VLC (with the redesigned Qt UI) for Windows x64 and uploads a portable zip and the
# NSIS installer (the release workflow, redesign-release.yml, publishes both for a tag).
# The second job runs the portable build on a Windows runner and uploads screenshots of it.
on:
  # every push to redesign, like the Linux build (a head commit with [skip ci] skips both)
  push:
    branches: [redesign]
  workflow_dispatch:

# one Windows build at a time: a newer push waits for the running one (cancelling a build would
# also skip its contrib cache save), and replaces an older one still waiting
concurrency:
  group: redesign-windows-${{ github.ref }}
  cancel-in-progress: false

# revision: 10
jobs:
  win64:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: registry.videolan.org/vlc-debian-win64-posix:20260611225331
      options: --user root
    steps:
      - uses: actions/checkout@v4

      # The prebuilt contrib URL 404s, so contribs build from source (about an hour); cache the result.
      - name: Restore contrib cache
        id: contribcache
        uses: actions/cache/restore@v4
        with:
          path: |
            contrib/contrib-win64
            contrib/x86_64-w64-mingw32
            contrib/tarballs
            contrib/python-venv
            extras/tools
          key: win64-contrib-v2-${{ hashFiles('contrib/src/**', 'extras/package/win32/build.sh') }}

      # The restored files keep their old mtimes, so make thinks every contrib is older than the freshly
      # checked-out sources and rebuilds all of them. Make them newer than the checkout.
      - name: Refresh contrib timestamps
        if: steps.contribcache.outputs.cache-hit == 'true'
        run: |
          # one single timestamp for every file (touching them one by one leaves make with random newer/older pairs)
          T=$(date +%s)
          find contrib/contrib-win64 contrib/x86_64-w64-mingw32 contrib/tarballs contrib/python-venv extras/tools -exec touch -h -d "@$T" {} + 2>/dev/null || true
          # cargo-c is installed by `cargo install` into the cargo home, which is not cached, so rav1e needs it rebuilt
          rm -f contrib/contrib-win64/.cargo-c

      - name: Build (release)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # -r runs `make package-win32` (zip, 7z and the NSIS installer); configure must find makensis
          command -v makensis || { apt-get update -qq && apt-get install -y -qq nsis; }
          extras/package/win32/build.sh -r -a x86_64 -p

      # Save right after the build so a later packaging failure does not throw away the contribs.
      - name: Save contrib cache
        if: success() && steps.contribcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            contrib/contrib-win64
            contrib/x86_64-w64-mingw32
            contrib/tarballs
            contrib/python-venv
            extras/tools
          key: win64-contrib-v2-${{ hashFiles('contrib/src/**', 'extras/package/win32/build.sh') }}

      - name: Collect portable zip and installer
        run: |
          # build.sh names the build directory after the short arch (win64), find it instead of guessing
          BUILD=$(dirname "$(find . -maxdepth 2 -name config.status -path './win*' | head -1)")
          echo "build dir: $BUILD"
          # build.sh -r already made the zip and the installer (make package-win32)
          mkdir -p out
          cp -v "$BUILD"/vlc-*-win*.zip "$BUILD"/vlc-*-win*.exe out/
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vlc-win64-portable
          path: out/
          retention-days: 14

  shots:
    needs: win64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vlc-win64-portable
          path: dl

      - name: Unpack
        shell: pwsh
        run: |
          Get-ChildItem dl
          Expand-Archive (Get-ChildItem dl -Filter *.zip | Select-Object -First 1).FullName -DestinationPath app
          Get-ChildItem app

      - name: Screenshots
        shell: pwsh
        run: |
          $dir = (Get-ChildItem app -Directory | Select-Object -First 1).FullName
          .github/scripts/win-shots.ps1 $dir "$PWD/shots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: shots/
          retention-days: 14

