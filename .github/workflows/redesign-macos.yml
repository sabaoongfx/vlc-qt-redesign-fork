name: Redesign macOS build

# Builds the redesign for macOS arm64 with the Qt interface (not the Cocoa VLC.app), Qt 6.10 from the
# Qt online installer. Phase M1 of redesign/MACOS-PLAN.md: done when it links and `vlc --list` shows qt.
# extras/package/redesign/macos-build.sh does the work, one step at a time so the contribs can be cached.
on:
  push:
    branches: [redesign]
  workflow_dispatch:

# a newer push waits for the running build (cancelling it would also skip the contrib cache save)
concurrency:
  group: redesign-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  # VLC_FORCE_KERNELVERSION=19 in macos-build.sh, like upstream's CI
  HOST_TRIPLET: aarch64-apple-darwin19

jobs:
  arm64:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      # No prebuilt macOS contribs (the VideoLAN URL 404s): the first run builds them from source, then they are cached.
      - name: Restore contrib cache
        id: contribcache
        uses: actions/cache/restore@v4
        with:
          path: |
            contrib/contrib-${{ env.HOST_TRIPLET }}
            contrib/${{ env.HOST_TRIPLET }}
            contrib/tarballs
            extras/tools
          key: macos-arm64-contrib-v1-${{ hashFiles('contrib/src/**', 'extras/tools/*.mak', 'extras/tools/bootstrap', 'extras/package/redesign/macos-build.sh') }}

      # one single timestamp for every restored file, newer than the checkout (see the Windows workflow)
      - name: Refresh contrib timestamps
        if: steps.contribcache.outputs.cache-hit == 'true'
        run: |
          # BSD touch: -t [[CC]YY]MMDDhhmm[.SS]
          STAMP=$(date +%Y%m%d%H%M.%S)
          find contrib/contrib-$HOST_TRIPLET contrib/$HOST_TRIPLET contrib/tarballs extras/tools -exec touch -h -t "$STAMP" {} + 2>/dev/null || true

      - name: Build tools
        timeout-minutes: 60
        run: extras/package/redesign/macos-build.sh tools

      - name: Build contribs
        if: steps.contribcache.outputs.cache-hit != 'true'
        timeout-minutes: 300
        run: extras/package/redesign/macos-build.sh contribs

      # The native tools (luac, protoc) install to contrib/bin, which the v1 cache paths miss (adding it
      # would change the cache version): rebuild them from the cached sources, a few minutes. In the
      # workflow, not in macos-build.sh, since that file is part of the cache key.
      - name: Contrib native tools
        if: steps.contribcache.outputs.cache-hit == 'true'
        timeout-minutes: 30
        run: |
          . extras/package/macosx/env.build.sh none
          export VLC_FORCE_KERNELVERSION=19
          vlcSetBaseEnvironment
          vlcSetSymbolEnvironment
          vlcSetContribEnvironment 13.0
          cd contrib/contrib-$HOST_TRIPLET
          rm -f .luac .protoc
          make .luac .protoc
          ls -la ../bin

      # right after the contribs, so a later VLC failure does not throw them away
      - name: Save contrib cache
        if: success() && steps.contribcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            contrib/contrib-${{ env.HOST_TRIPLET }}
            contrib/${{ env.HOST_TRIPLET }}
            contrib/tarballs
            extras/tools
          key: macos-arm64-contrib-v1-${{ hashFiles('contrib/src/**', 'extras/tools/*.mak', 'extras/tools/bootstrap', 'extras/package/redesign/macos-build.sh') }}

      - name: Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtshadertools
          cache: true

      - name: ccache
        run: |
          brew install ccache
          mkdir -p ccache-bin
          ln -sf "$(brew --prefix)/bin/ccache" ccache-bin/cc
          ln -sf "$(brew --prefix)/bin/ccache" ccache-bin/c++
          ls "$QT_ROOT_DIR/bin" | head -40

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: macos-arm64-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            macos-arm64-ccache-${{ github.ref_name }}-
            macos-arm64-ccache-

      - name: Build VLC
        run: |
          Q="$QT_ROOT_DIR/bin/qmake6"
          [ -x "$Q" ] || Q="$QT_ROOT_DIR/bin/qmake"
          VLC_CCACHE_BINS_PATH="$PWD/ccache-bin" extras/package/redesign/macos-build.sh vlc "$Q"
          "$(brew --prefix)/bin/ccache" -s

      - name: Smoke test
        run: |
          # starts, lists the Qt interface and exits (no window); Qt frameworks come from the Qt install until M2 bundles them
          export DYLD_FRAMEWORK_PATH="$QT_ROOT_DIR/lib"
          V=build/install/bin/vlc
          ls -la build/install/bin
          $V --version | head -3
          $V --list > list.txt 2>&1 || true
          grep -E "^ +qt " list.txt || { echo "::error::Qt interface missing"; tail -50 list.txt; exit 1; }

      - name: Pack the install tree
        run: tar -C build -czf vlc-macos-arm64-install.tar.gz install

      - name: Upload the install tree
        uses: actions/upload-artifact@v4
        with:
          name: vlc-macos-arm64-install
          path: vlc-macos-arm64-install.tar.gz
          retention-days: 14

      # M2: extras/package/redesign/macapp.sh, the counterpart of appimage.sh
      - name: App and dmg
        run: |
          Q="$QT_ROOT_DIR/bin/qmake6"
          [ -x "$Q" ] || Q="$QT_ROOT_DIR/bin/qmake"
          extras/package/redesign/macapp.sh build/install . "$Q" out

      - name: App smoke test
        run: |
          # the bundle alone: no DYLD paths, everything from Contents/
          V="out/VLC juxtopposed.app/Contents/MacOS/VLC"
          "$V" --version | head -3
          "$V" --list > applist.txt 2>&1 || true
          grep -E "^ +qt " applist.txt || { echo "::error::Qt interface missing in the app"; tail -80 applist.txt; exit 1; }
          if grep -q "stale plugins cache" applist.txt; then echo "::error::stale plugin cache"; exit 1; fi
          # the Qt interface runs this first and silently gives way to skins2 if it fails (the runner has a desktop)
          "out/VLC juxtopposed.app/Contents/MacOS/vlc-qt-check" || { echo "::error::vlc-qt-check failed ($?)"; exit 1; }

      # M3: the runner has a logged-in desktop; screencapture shoots the whole screen
      - name: Screenshots
        timeout-minutes: 15
        # the dmg is uploaded even when the shots fail
        continue-on-error: true
        run: |
          brew install ffmpeg > /dev/null
          ffmpeg -loglevel error -f lavfi -i "testsrc2=size=854x480:rate=30" -f lavfi -i "sine=frequency=440" \
            -t 60 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest test.mp4
          V="$PWD/out/VLC juxtopposed.app/Contents/MacOS/VLC"
          mkdir -p shots
          shot() { # shot <name> <seconds> [vlc args...]
            local name=$1 wait=$2; shift 2
            "$V" --no-qt-privacy-ask --verbose=1 "$@" > "shots/$name.log" 2>&1 &
            local pid=$!
            sleep "$wait"
            screencapture -x "shots/$name.png" || echo "::warning::screencapture failed for $name"
            kill "$pid" 2>/dev/null; sleep 2; kill -9 "$pid" 2>/dev/null || true
          }
          shot home 15 --no-media-library
          shot player 15 --no-media-library "$PWD/test.mp4"
          shot library 20
          ls -la shots
          # the shots must show the Qt interface, not the skins2 fallback
          if grep -l "skins2 interface" shots/*.log; then echo "::error::the Qt interface did not open (skins2 ran)"; exit 1; fi

      - name: QML warnings
        if: always()
        run: |
          # QML load errors do not fail the build: list them (the first view of screens the shots do not reach)
          grep -hE "qml|QML" shots/*.log 2>/dev/null | grep -iE "warning|error|is not a type|ReferenceError|TypeError|Cannot assign|binding loop" \
            | sort | uniq -c | sort -rn | tee shots/qml-warnings.txt | head -40 || true
          while read -r n line; do echo "::warning::$line"; done < <(head -20 shots/qml-warnings.txt 2>/dev/null)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshots
          path: shots/
          retention-days: 14

      - name: Logs on failure
        if: failure()
        run: |
          tail -200 build/config.log 2>/dev/null || true

      - name: Upload the dmg
        uses: actions/upload-artifact@v4
        with:
          name: vlc-macos-arm64
          path: out/VLC-juxtopposed-arm64.dmg
          retention-days: 30
