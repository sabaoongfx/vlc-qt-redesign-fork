name: Redesign Linux packages

# Builds the redesign for Linux x86_64 as an AppImage and a self-contained tarball (the same
# AppDir). Built on Ubuntu 24.04 (glibc 2.39) with Qt 6.10 from the Qt online installer, so the
# packages run on Ubuntu 24.04+, Debian 13+, Fedora 40+, Arch/Manjaro. The release workflow
# (redesign-release.yml) picks the artifact up for a tag.
on:
  push:
    branches: [redesign]
  workflow_dispatch:

concurrency:
  group: redesign-linux-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        timeout-minutes: 20
        run: |
          # no debconf questions (jackd2 asks about realtime priority and the job waited for an answer);
          # sudo drops the environment, so pass it through
          A="sudo DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
          # Ubuntu's own VLC 3 build dependencies cover nearly all of VLC 4's
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          $A update -qq
          $A build-dep -y -qq vlc
          $A install -y -qq ccache meson ninja-build nasm flex bison gettext autopoint \
            libtool-bin pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor0 libxcb-cursor-dev \
            libwayland-dev wayland-protocols libegl-dev libgl-dev libvulkan-dev libsqlite3-dev \
            libjpeg-dev libplacebo-dev libdav1d-dev libpipewire-0.3-dev libsoxr-dev libtag1-dev \
            libfuse2t64 desktop-file-utils

      - name: Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          # qtwayland is part of the base install since 6.7 (not an add-on module)
          modules: qtshadertools qtimageformats
          cache: true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: appimage-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            appimage-ccache-${{ github.ref_name }}-
            appimage-ccache-

      - name: Restore medialibrary contrib cache
        uses: actions/cache@v4
        with:
          path: |
            contrib/native
            contrib/x86_64-linux-gnu
            contrib/tarballs
          key: appimage-contrib-medialibrary-${{ hashFiles('contrib/src/medialibrary/**', 'contrib/src/sqlite/**') }}

      - name: Build medialibrary contrib
        run: |
          # no medialibrary package on Ubuntu; without it there is no Video/Music library
          cd contrib
          mkdir -p native && cd native
          ../bootstrap
          make -j"$(nproc)" .medialibrary

      - name: Configure
        run: |
          ./bootstrap
          CC="ccache gcc" CXX="ccache g++" ./configure --prefix=/usr --disable-nls \
            QMAKE6="$QT_ROOT_DIR/bin/qmake6"
          grep -E "^(QT_|HAVE_QT|ENABLE_QT)" config.log | head || true

      - name: Build
        run: |
          make -j"$(nproc)"
          make install DESTDIR="$PWD/stage"
          ccache -s

      - name: AppImage and tarball
        run: |
          # extras/package/redesign/appimage.sh: the same script is tested locally against the dev build
          mkdir -p tools && cd tools
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          cd ..
          TOOLS=$PWD/tools extras/package/redesign/appimage.sh stage/usr . "$QT_ROOT_DIR/bin/qmake6" out

      - name: Smoke test
        run: |
          # starts, lists the Qt interface and exits (no display needed); the plugin cache matches
          A=out/VLC-juxtopposed-x86_64.AppImage
          $A --version | head -3
          $A --list 2>/dev/null | grep -E "^ +qt " || { echo "::error::Qt interface missing"; exit 1; }
          if $A --list 2>&1 | grep -q "stale plugins cache"; then echo "::error::stale plugin cache"; exit 1; fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vlc-linux-packages
          path: out/
          retention-days: 30
