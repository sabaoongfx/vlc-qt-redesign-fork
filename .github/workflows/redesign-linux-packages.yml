name: Redesign Linux packages

# Builds the redesign for Linux x86_64 as an AppImage and a self-contained tarball (the same
# AppDir). Built on Ubuntu 24.04 (glibc 2.39) with Qt 6.10 from the Qt online installer, so the
# packages run on Ubuntu 24.04+, Debian 13+, Fedora 40+, Arch/Manjaro. The release workflow
# (redesign-release.yml) picks the artifact up for a tag.
on:
  push:
    branches: [redesign]
  workflow_dispatch:

concurrency:
  group: redesign-linux-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        timeout-minutes: 30
        run: |
          # no debconf questions (jackd2 asks about realtime priority and the job waited for an answer);
          # sudo drops the environment, so pass it through
          A="env DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
          # build-dep now and then hangs on a download until the step timeout: give each try 8 minutes and
          # retry (apt resumes, finished downloads stay in the cache)
          retry() {
            for i in 1 2 3; do
              sudo timeout 480 "$@" && return 0
              echo "::warning::try $i failed: $*"
              sudo dpkg --configure -a || true
            done
            return 1
          }
          # Ubuntu's own VLC 3 build dependencies cover nearly all of VLC 4's
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          retry $A update -qq
          retry $A build-dep -y -qq vlc
          retry $A install -y -qq ccache meson ninja-build nasm flex bison gettext autopoint \
            libtool-bin pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor0 libxcb-cursor-dev \
            libwayland-dev wayland-protocols libexpat1-dev libegl-dev libgl-dev libvulkan-dev libsqlite3-dev \
            libjpeg-dev libplacebo-dev libdav1d-dev libpipewire-0.3-dev libsoxr-dev libtag1-dev \
            libfuse2t64 desktop-file-utils

      - name: Qt 6.10
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          # qtwayland is part of the base install since 6.7 (not an add-on module)
          # no qtimageformats: its TIFF/WebP plugins link libtiff.so.5, which Ubuntu 24.04 lacks (linuxdeploy stops)
          modules: qtshadertools
          cache: true

      - name: Drop Qt image plugins linking libraries Ubuntu 24.04 lacks
        run: |
          # the Qt cache can still hold qtimageformats from an older key (restore-keys fall back to it)
          rm -f "$QT_ROOT_DIR"/plugins/imageformats/libq{tiff,webp,mng}.so

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: appimage-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            appimage-ccache-${{ github.ref_name }}-
            appimage-ccache-

      - name: Restore medialibrary contrib cache
        uses: actions/cache@v4
        with:
          path: |
            contrib/native
            contrib/x86_64-linux-gnu
            contrib/tarballs
          key: appimage-contrib-medialibrary-${{ hashFiles('contrib/src/medialibrary/**', 'contrib/src/sqlite/**', 'extras/package/redesign/medialibrary-*.patch') }}

      - name: Build medialibrary contrib
        run: |
          # no medialibrary package on Ubuntu; without it there is no Video/Music library
          cd contrib
          mkdir -p native && cd native
          ../bootstrap
          # our medialibrary patch (Resync retries files that failed to parse); kept out of contrib/src so the
          # Windows and macOS contrib caches (keyed on contrib/src) are not rebuilt for it
          if [ ! -e .medialibrary ]; then
            make -j"$(nproc)" medialibrary
            patch -p1 -d medialibrary < "$GITHUB_WORKSPACE"/extras/package/redesign/medialibrary-retry-queues-tasks.patch
          fi
          make -j"$(nproc)" .medialibrary

      - name: wayland-scanner 1.23
        run: |
          # VLC's Wayland video outputs (egl_wl, wl_shm, xdg-shell) need wayland-scanner >= 1.23 and
          # Ubuntu 24.04 has 1.22: configure dropped Wayland without a word, and on a Wayland session
          # the AppImage put the video in an X11 window that the Wayland interface lost (v0.1.5)
          cd "$RUNNER_TEMP"
          curl -sSL https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.23.1/downloads/wayland-1.23.1.tar.xz -o wl.tar.xz
          echo "864fb2a8399e2d0ec39d56e9d9b753c093775beadc6022ce81f441929a81e5ed  wl.tar.xz" | sha256sum -c
          tar xJf wl.tar.xz
          meson setup wl-build wayland-1.23.1 -Dlibraries=false -Ddocumentation=false -Dtests=false \
            -Ddtd_validation=false --prefix="$RUNNER_TEMP/wl"
          ninja -C wl-build install
          echo "WAYLAND_SCANNER=$RUNNER_TEMP/wl/bin/wayland-scanner" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          ./bootstrap
          # --enable-wayland: fail here instead of shipping an AppImage without Wayland video
          CC="ccache gcc" CXX="ccache g++" ./configure --prefix=/usr --disable-nls --enable-wayland \
            WAYLAND_SCANNER="$WAYLAND_SCANNER" QMAKE6="$QT_ROOT_DIR/bin/qmake6"
          grep -E "^(QT_|HAVE_QT|ENABLE_QT)" config.log | head || true

      - name: Build
        run: |
          make -j"$(nproc)"
          make install DESTDIR="$PWD/stage"
          ccache -s

      - name: AppImage and tarball
        run: |
          # extras/package/redesign/appimage.sh: the same script is tested locally against the dev build
          mkdir -p tools && cd tools
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          cd ..
          TOOLS=$PWD/tools extras/package/redesign/appimage.sh stage/usr . "$QT_ROOT_DIR/bin/qmake6" out

      - name: Smoke test
        run: |
          # starts, lists the Qt interface and exits (no display needed); the plugin cache matches
          A=out/VLC-juxtopposed-x86_64.AppImage
          $A --version | head -3
          $A --list 2>/dev/null | grep -E "^ +qt " || { echo "::error::Qt interface missing"; exit 1; }
          if $A --list 2>&1 | grep -q "stale plugins cache"; then echo "::error::stale plugin cache"; exit 1; fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vlc-linux-packages
          path: out/
          retention-days: 30

      - name: deb, rpm and Arch packages
        run: |
          # the release workflow makes the published ones from the tarball with the tag's version (and
          # signs them); these are for the install test below
          extras/package/redesign/get-nfpm.sh "$RUNNER_TEMP/nfpm"
          NFPM="$RUNNER_TEMP/nfpm/nfpm" extras/package/redesign/linux-packages.sh \
            out/VLC-juxtopposed-x86_64.tar.gz "0.0.${{ github.run_number }}" distro

      - name: Upload the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: vlc-linux-distro-packages
          path: distro/
          retention-days: 7

  # each package installs on a clean distribution with its own package manager pulling the
  # dependencies, and runs: the command works, the Qt interface loads, no library is missing
  install-test:
    needs: appimage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./VLC-juxtopposed-amd64.deb util-linux
          - image: debian:trixie
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./VLC-juxtopposed-amd64.deb util-linux
          - image: fedora:latest
            install: dnf install -y -q ./VLC-juxtopposed-x86_64.rpm util-linux
          - image: opensuse/tumbleweed
            install: zypper --non-interactive install --allow-unsigned-rpm ./VLC-juxtopposed-x86_64.rpm util-linux
          - image: archlinux:latest
            install: pacman -Syu --noconfirm --needed util-linux && pacman -U --noconfirm ./vlc-juxtopposed-*.pkg.tar.zst
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vlc-linux-distro-packages

      - name: Install
        run: ${{ matrix.install }}

      - name: Run
        run: |
          set -eu
          # VLC refuses to run as root (the container's user): run it as nobody
          mkdir -p /tmp/u && chmod 777 /tmp/u
          run() { setpriv --reuid=65534 --regid=65534 --clear-groups env HOME=/tmp/u vlc-juxtopposed "$@"; }
          run --version | head -1
          run --list > /tmp/list.txt 2>&1 || { cat /tmp/list.txt; echo "::error::vlc-juxtopposed --list failed"; exit 1; }
          grep -E "^ +qt " /tmp/list.txt || { head -20 /tmp/list.txt; echo "::error::Qt interface missing"; exit 1; }
          if grep -q "stale plugins cache" /tmp/list.txt; then echo "::error::stale plugin cache"; exit 1; fi
          # the interface, the core and the Wayland/X11 video outputs must resolve every library
          missing=""
          for f in /opt/vlc-juxtopposed/usr/bin/vlc /opt/vlc-juxtopposed/usr/lib/libvlccore.so.9 \
                   /opt/vlc-juxtopposed/usr/lib/vlc/plugins/gui/libqt_plugin.so \
                   /opt/vlc-juxtopposed/usr/lib/vlc/plugins/video_output/libegl_wl_plugin.so \
                   /opt/vlc-juxtopposed/usr/lib/vlc/plugins/video_output/libxcb_window_plugin.so \
                   /opt/vlc-juxtopposed/usr/plugins/platforms/libqwayland.so \
                   /opt/vlc-juxtopposed/usr/plugins/platforms/libqxcb.so; do
            m=$(ldd "$f" | grep "not found" || true)
            [ -z "$m" ] || missing="$missing\n$f:\n$m"
          done
          [ -z "$missing" ] || { printf "::error::missing libraries:%b\n" "$missing"; exit 1; }
          test -f /usr/share/applications/vlc-juxtopposed.desktop
          echo "installed and runs on ${{ matrix.image }}"

  # GitHub keeps 10 GB of caches per repository and evicts the least recently used: one ccache per
  # commit per workflow (300-900 MB each) pushed out the Windows contrib cache (a 2-hour rebuild,
  # 2026-11-01). After a successful build (its new ccache is saved at the end of that job), drop this
  # workflow's older ones on the branch.
  prune-ccache:
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PREFIX: appimage-ccache-${{ github.ref_name }}-
      KEEP: appimage-ccache-${{ github.ref_name }}-${{ github.sha }}
    steps:
      - name: Delete older ccaches
        run: |
          gh cache list --key "$PREFIX" --limit 100 --json id,key --jq '.[] | select(.key != env.KEEP) | .id' |
            while read -r id; do gh cache delete "$id" && echo "deleted cache $id"; done

