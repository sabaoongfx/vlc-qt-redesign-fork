name: Redesign build

on:
  push:
    branches: [redesign]
  workflow_dispatch:

jobs:
  linux-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Same image upstream VLC uses for its debian CI job (has Qt and all build deps).
    container:
      image: registry.videolan.org/vlc-debian-unstable:20260611225331
      # The image's default user can't write the runner's temp dir (EACCES in checkout).
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./bootstrap
          ./configure --prefix=$PWD/install --disable-nls

      - name: Build
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install

      - name: Screenshot main window (best effort)
        continue-on-error: true
        run: |
          apt-get update -qq && apt-get install -y -qq imagemagick x11-apps xvfb
          # VLC refuses to run as root, so run it as an unprivileged user.
          id shotuser >/dev/null 2>&1 || useradd -m shotuser
          mkdir -p shots
          chown -R shotuser "$PWD/shots"
          chmod -R a+rX "$PWD/install"
          cat > /tmp/shot.sh <<'SH'
          export VLC_PLUGIN_PATH="$1/install/lib/vlc/plugins"
          export QT_QPA_PLATFORM=xcb
          "$1/install/bin/vlc" --no-media-library -I qt >"$1/shots/vlc.log" 2>&1 &
          VLC_PID=$!
          sleep 20
          import -window root "$1/shots/main.png" || true
          kill $VLC_PID || true
          SH
          chmod +x /tmp/shot.sh
          runuser -u shotuser -- xvfb-run -a -s "-screen 0 1280x800x24" /tmp/shot.sh "$PWD"
          ls -la shots

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: vlc-linux-install
          path: install/
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
