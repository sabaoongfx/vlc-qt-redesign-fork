name: Redesign build

on:
  push:
    branches: [redesign]
  workflow_dispatch:

# one build at a time per branch: a newer push waits for the running one and replaces an older waiting one
concurrency:
  group: redesign-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Same image upstream VLC uses for its debian CI job (has Qt and all build deps).
    container:
      image: registry.videolan.org/vlc-debian-unstable:20260611225331
      # The image's default user can't write the runner's temp dir (EACCES in checkout).
      options: --user root
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: apt-get update -qq && apt-get install -y -qq ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Restore medialibrary contrib cache
        uses: actions/cache@v4
        with:
          path: |
            contrib/native
            contrib/x86_64-linux-gnu
            contrib/tarballs
          key: contrib-medialibrary-${{ hashFiles('contrib/src/medialibrary/**', 'contrib/src/sqlite/**') }}

      - name: Build medialibrary contrib
        run: |
          # The image has no medialibrary; without it VLC builds no Videos/Music library.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd contrib
          mkdir -p native && cd native
          ../bootstrap
          make -j"$(getconf _NPROCESSORS_ONLN)" .medialibrary

      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./bootstrap
          CC="ccache gcc" CXX="ccache g++" ./configure --prefix=$PWD/install --disable-nls

      - name: Build
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install
          ccache -s

      - name: Screenshots, day and night (best effort)
        continue-on-error: true
        run: |
          apt-get install -y -qq imagemagick x11-apps xvfb xdotool
          # VLC refuses to run as root, so run it as an unprivileged user.
          id shotuser >/dev/null 2>&1 || useradd -m shotuser
          mkdir -p shots
          chown -R shotuser "$PWD/shots"
          chmod -R a+rX "$PWD/install"
          cat > /tmp/shot.sh <<'SH'
          # $1 = workspace, $2 = name, $3 = color-scheme-index (0 system, 1 day, 2 night)
          mkdir -p "$HOME/.config/vlc"
          printf '[MainWindow]\ncolor-scheme-index=%s\n' "$3" > "$HOME/.config/vlc/vlc-qt-interface.conf"
          export VLC_PLUGIN_PATH="$1/install/lib/vlc/plugins"
          export QT_QPA_PLATFORM=xcb
          "$1/install/bin/vlc" --verbose=1 --no-media-library --no-qt-privacy-ask -I qt >"$1/shots/$2.log" 2>&1 &
          VLC_PID=$!
          sleep 12
          WID=$(xdotool search --onlyvisible --class vlc | head -1)
          xdotool windowmove "$WID" 0 0 windowsize "$WID" 1280 800 || true
          sleep 5
          import -window root "$1/shots/$2.png" || true
          # dialogs: Open Media (Ctrl+O), then Preferences (Ctrl+P: the sidebar has no Preferences row)
          xdotool mousemove 740 431; sleep 0.3; xdotool click 1; sleep 3 # "Open File" button
          import -window root "$1/shots/$2-open.png" || true
          xdotool key Escape; sleep 1
          xdotool windowfocus "$WID" || true; xdotool key --clearmodifiers ctrl+p; sleep 4
          import -window root "$1/shots/$2-prefs.png" || true
          xdotool mousemove 365 78; sleep 0.3; xdotool click 1; sleep 2 # Audio tab
          import -window root "$1/shots/$2-prefs-audio.png" || true
          xdotool mousemove 813 78; sleep 0.3; xdotool click 1; sleep 2 # Hotkeys tab
          import -window root "$1/shots/$2-prefs-hotkeys.png" || true
          xdotool mousemove 459 78; sleep 0.3; xdotool click 1; sleep 2 # Video tab
          import -window root "$1/shots/$2-prefs-video.png" || true
          xdotool mousemove 270 78; sleep 0.3; xdotool click 1; sleep 2 # back to Interface
          xdotool mousemove 315 397; sleep 0.3; xdotool click 1; sleep 3 # Customize Toolbar
          import -window root "$1/shots/$2-toolbar.png" || true
          xdotool key Escape; sleep 1
          kill $VLC_PID || true
          sleep 2
          SH
          chmod +x /tmp/shot.sh
          for mode in "day 1" "night 2"; do
            set -- $mode
            runuser -u shotuser -- xvfb-run -a -s "-screen 0 1280x800x24" /tmp/shot.sh "$PWD" "$1" "$2"
          done
          ls -la shots

      - name: Player screenshots, day and night (best effort)
        continue-on-error: true
        run: |
          apt-get install -y -qq ffmpeg xdotool gdb python3 sqlite3
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=854x480:rate=30 -f lavfi -i sine=frequency=440 \
            -t 60 -pix_fmt yuv420p /tmp/test.mp4
          chmod a+r /tmp/test.mp4
          cat > /tmp/shot-player.sh <<'SH'
          # $1 = workspace, $2 = name, $3 = color-scheme-index
          mkdir -p "$HOME/.config/vlc"
          printf '[MainWindow]\ncolor-scheme-index=%s\n' "$3" > "$HOME/.config/vlc/vlc-qt-interface.conf"
          export VLC_PLUGIN_PATH="$1/install/lib/vlc/plugins"
          export QT_QPA_PLATFORM=xcb
          "$1/install/bin/vlc" --verbose=1 --no-media-library --no-qt-privacy-ask --aout=dummy /tmp/test.mp4 >"$1/shots/$2.log" 2>&1 &
          VLC_PID=$!
          sleep 12
          xdotool mousemove 700 400; sleep 0.3; xdotool mousemove 760 440; sleep 0.3; xdotool mousemove 800 470; sleep 0.4
          import -window root "$1/shots/$2.png" || true
          # hover an icon button (bottom-left controls) to capture its hover state
          xdotool mousemove 736 770; sleep 0.2; xdotool mousemove 737 771; sleep 0.5
          import -window root "$1/shots/$2-hover.png" || true
          # open the subtitles/tracks menu (bottom-left first icon)
          xdotool mousemove 696 770; sleep 0.3; xdotool click 1; sleep 1.5
          import -window root "$1/shots/$2-tracks.png" || true
          # switch to the Audio tab
          xdotool mousemove 1275 369; sleep 0.3; xdotool click 1; sleep 1
          import -window root "$1/shots/$2-tracks-audio.png" || true
          kill $VLC_PID || true
          sleep 2
          SH
          chmod +x /tmp/shot-player.sh
          for mode in "player-day 1" "player-night 2"; do
            set -- $mode
            runuser -u shotuser -- xvfb-run -a -s "-screen 0 1920x1080x24" /tmp/shot-player.sh "$PWD" "$1" "$2"
          done
          ls -la shots

      - name: Library screenshots, day and night (best effort)
        continue-on-error: true
        run: |
          # Sample media in the XDG Videos/Music dirs; Phase A opens both folders, which adds them to the library.
          H=/home/shotuser
          mkdir -p $H/Videos $H/Music $H/.config
          printf 'XDG_VIDEOS_DIR="$HOME/Videos"\nXDG_MUSIC_DIR="$HOME/Music"\n' > $H/.config/user-dirs.dirs
          i=0
          for t in "Night Harbor" "Paper Cities" "The Long Road" "Glass Garden" "Slow Orbit" "Red Station" "Quiet Machines" "Salt and Static"; do
            i=$((i+1))
            ffmpeg -loglevel error -y -f lavfi -i "testsrc2=size=640x360:rate=24" -f lavfi -i "sine=frequency=$((200+i*40))" \
              -t $((20+i*7)) -pix_fmt yuv420p -metadata title="$t" "$H/Videos/$t.mp4"
          done
          n=0
          for artist in "Aurora Lane" "North Coast" "Violet Hours"; do
            for album in "First Light" "Second Wind"; do
              for tr in 1 2 3; do
                n=$((n+1))
                ffmpeg -loglevel error -y -f lavfi -i "sine=frequency=$((220+n*20))" -t 6 -c:a aac \
                  -metadata artist="$artist" -metadata album_artist="$artist" -metadata album="$album" \
                  -metadata title="Track $tr" -metadata track=$tr -metadata genre="Ambient" \
                  "$H/Music/$artist - $album - $tr.m4a"
              done
            done
          done
          chown -R shotuser $H
          mkdir -p shots; chown -R shotuser "$PWD/shots"
          cat > /tmp/shot-lib.sh <<'SH'
          # $1 = workspace
          export VLC_PLUGIN_PATH="$1/install/lib/vlc/plugins"
          export QT_QPA_PLATFORM=xcb
          click() { xdotool mousemove "$1" "$2"; sleep 0.3; xdotool click 1; }
          # quit VLC and wait for it: a VLC that hangs keeps the media library lock and its frozen
          # window covers the next launches (every library shot then showed a VLC without the
          # library). A hang leaves its threads' stacks in shots/hang-<name>.txt.
          stop() {
            kill "$PID" 2>/dev/null || true
            for i in $(seq 20); do kill -0 "$PID" 2>/dev/null || return 0; sleep 1; done
            { echo "VLC $1 did not quit in 20 s"
              for t in /proc/$PID/task/*; do echo "$t $(cat $t/comm) $(cat $t/wchan)"; done
              gdb -batch -p "$PID" -ex "thread apply all bt"
            } >"$2/shots/hang-$1.txt" 2>&1
            kill -9 "$PID" 2>/dev/null || true; sleep 2
          }
          resize() {
            WID=$(xdotool search --onlyvisible --class vlc | head -1)
            xdotool windowmove "$WID" 0 0 windowsize "$WID" 1280 800 || true
          }
          # Phase A: first run. Click through the wizard (Next, Next, Next, Finish; it adds no folders), then open
          # Videos and Music with Open Folder (Ctrl+F, path typed in Qt's own folder dialog): an opened folder joins
          # the library. Then let it scan.
          rm -rf "$HOME/.config/vlc" "$HOME/.local/share/vlc"
          "$1/install/bin/vlc" --verbose=1 -I qt --aout=dummy >"$1/shots/lib-setup.log" 2>&1 &
          PID=$!
          sleep 14
          import -window root "$1/shots/lib-wizard.png" || true
          for k in 1 2 3 4; do click 979 587; sleep 2; done
          for d in Videos Music; do
            WID=$(xdotool search --onlyvisible --class vlc | head -1)
            xdotool windowfocus "$WID" || true; sleep 1
            xdotool key --clearmodifiers ctrl+f; sleep 3
            xdotool type --delay 30 "$HOME/$d"; sleep 0.5; xdotool key Return; sleep 4
          done
          import -window root "$1/shots/lib-opened-folders.png" || true
          sleep 45
          import -window root "$1/shots/lib-after-setup.png" || true
          stop setup "$1"
          # Phase B: one launch per theme.
          for mode in "day 1" "night 2"; do
            set -- "$1" $mode
            printf '[MainWindow]\ncolor-scheme-index=%s\n' "$3" > "$HOME/.config/vlc/vlc-qt-interface.conf"
            "$1/install/bin/vlc" --verbose=1 -I qt --no-qt-privacy-ask --aout=dummy >"$1/shots/lib-$2.log" 2>&1 &
            PID=$!
            sleep 12; resize; sleep 5
            import -window root "$1/shots/lib-home-$2.png" || true
            click 80 108; sleep 6
            import -window root "$1/shots/lib-video-$2.png" || true
            xdotool mousemove 400 200; sleep 0.3; xdotool mousemove 402 202; sleep 0.6
            import -window root "$1/shots/lib-video-$2-hover.png" || true
            click 80 154; sleep 6 # Music: the folders that hold music
            import -window root "$1/shots/lib-music-$2.png" || true
            click 80 108; sleep 4; click 863 77; sleep 4 # Video again, switch to list view
            import -window root "$1/shots/lib-videolist-$2.png" || true
            xdotool mousemove 600 150; sleep 0.3; xdotool mousemove 602 152; sleep 0.6
            import -window root "$1/shots/lib-videolist-$2-hover.png" || true
            click 863 77; sleep 3 # back to the grid (the view is shared by the pages)
            # Music is a folder tree like Videos: the first card is the Music folder, one click
            # opens it on its songs
            click 80 154; sleep 5
            click 390 220; sleep 5
            import -window root "$1/shots/lib-music-folder-$2.png" || true
            click 80 200; sleep 5 # Network
            import -window root "$1/shots/lib-browse-$2.png" || true
            click 80 246; sleep 5 # Playlists
            import -window root "$1/shots/lib-playlists-$2.png" || true
            # the header: count, sort 824, view 863, search 900-1215, '...' 1244
            click 80 108; sleep 5; click 824 77; sleep 2 # Video, sort menu
            import -window root "$1/shots/lib-sort-$2.png" || true
            xdotool key Escape; sleep 1; click 1050 77; sleep 2 # search field
            import -window root "$1/shots/lib-search-$2.png" || true
            xdotool key Escape; sleep 1
            click 1244 77; sleep 2 # '...': the folder context menu
            import -window root "$1/shots/lib-foldermenu-$2.png" || true
            xdotool key Escape; sleep 1
            click 1094 20; sleep 3 # playlist pane
            import -window root "$1/shots/lib-playlist-$2.png" || true
            click 1094 20; sleep 2
            click 1138 20; sleep 2 # overflow menu
            import -window root "$1/shots/lib-menu-$2.png" || true
            xdotool key Escape; sleep 1
            click 1138 20; sleep 2; click 1155 233; sleep 2 # overflow menu > Help
            import -window root "$1/shots/lib-help-$2.png" || true
            click 1021 277; sleep 4 # About
            import -window root "$1/shots/dlg-about-$2.png" || true
            xdotool key Escape; sleep 1
            click 1138 20; sleep 2; click 1155 187; sleep 2 # overflow menu > Tools
            import -window root "$1/shots/lib-tools-$2.png" || true
            click 942 187; sleep 4 # Effects and Filters
            import -window root "$1/shots/dlg-effects-$2.png" || true
            xdotool key Escape; sleep 1
            click 1138 20; sleep 2; click 1155 187; sleep 2; click 920 349; sleep 4 # Messages
            import -window root "$1/shots/dlg-messages-$2.png" || true
            xdotool key Escape; sleep 1
            click 1138 20; sleep 2; click 1155 187; sleep 2; click 957 377; sleep 4 # Plugins and extensions
            import -window root "$1/shots/dlg-plugins-$2.png" || true
            xdotool key Escape; xdotool key Escape; sleep 1
            stop "$2" "$1"
          done
          # Phase C: the Network page (night, once). Play in the Figma dialog must play at once; a
          # stream saved with it must show in the list and play on a click. The step's web server
          # logs every request VLC makes (shots/net-http.log); the "Network stream checks" step
          # reads it and the library database. The dialog is opened with the page's Add stream
          # button (Ctrl+N did not reach the window in CI, run 40928565745).
          printf '[MainWindow]\ncolor-scheme-index=2\n' > "$HOME/.config/vlc/vlc-qt-interface.conf"
          "$1/install/bin/vlc" --verbose=1 -I qt --no-qt-privacy-ask --aout=dummy >"$1/shots/lib-network.log" 2>&1 &
          PID=$!
          sleep 12; resize; sleep 5
          click 80 200; sleep 5 # Network
          import -window root "$1/shots/net-empty.png" || true
          click 676 488; sleep 3 # Add stream (centred while the list is empty)
          xdotool type --delay 30 "http://127.0.0.1:8765/played.mp4"; sleep 0.5
          import -window root "$1/shots/net-dialog.png" || true
          xdotool key --clearmodifiers ctrl+Return; sleep 8 # Play
          import -window root "$1/shots/net-played.png" || true
          xdotool key s; sleep 2 # stop, so the next requests come from the click below
          # Add stream, now in the bar above the list (Space on it did nothing, run 40932298301)
          click 286 150; sleep 3
          xdotool type --delay 30 "http://127.0.0.1:8765/saved.mp4"; sleep 0.5
          xdotool key Tab; sleep 0.5; xdotool key Return; sleep 6 # Save: Enter in the empty name field
          import -window root "$1/shots/net-saved.png" || true
          grep -c 'GET /' "$1/shots/net-http.log" > "$1/shots/net-gets-after-save.txt" || true
          # the first row of the list: rows from y 205, 40px (run 40932298301)
          click 600 224; sleep 8
          import -window root "$1/shots/net-clicked.png" || true
          grep -c 'GET /' "$1/shots/net-http.log" > "$1/shots/net-gets-after-click.txt" || true
          # Ctrl+N (the VLC menu's shortcut), information only
          WID=$(xdotool search --onlyvisible --class vlc | head -1)
          xdotool windowfocus "$WID" || true; sleep 1
          xdotool key --clearmodifiers ctrl+n; sleep 3
          import -window root "$1/shots/net-ctrln.png" || true
          xdotool key Escape; sleep 1
          stop network "$1"
          SH
          chmod +x /tmp/shot-lib.sh
          # the web server of Phase C (two copies of the test video)
          mkdir -p /tmp/net; cp /tmp/test.mp4 /tmp/net/saved.mp4; cp /tmp/test.mp4 /tmp/net/played.mp4
          : > shots/net-http.log; chmod a+r shots/net-http.log
          (cd /tmp/net && exec python3 -u -m http.server 8765 --bind 127.0.0.1) >/dev/null 2>>shots/net-http.log &
          HTTP_PID=$!
          runuser -u shotuser -- xvfb-run -a -s "-screen 0 1280x800x24" /tmp/shot-lib.sh "$PWD"
          kill $HTTP_PID || true
          ls -la shots

      # Phase C of the library screenshots, checked: Play in the dialog opens the stream at once, a
      # saved stream is in the library history (the list the Network page shows), a click on a
      # saved stream opens it.
      # Fails the job (unlike the screenshots).
      - name: Network stream checks
        run: |
          DB=/home/shotuser/.local/share/vlc/ml/ml.db
          fail=0
          ok() { echo "PASS: $1"; }
          ko() { echo "::error title=Network check::$1"; fail=1; }
          echo "--- requests"; cat shots/net-http.log || true
          if [ ! -f "$DB" ]; then
            ko "no media library database at $DB"
          else
            rows=$(sqlite3 "$DB" "SELECT f.mrl, m.last_played_date FROM File f JOIN Media m ON m.id_media = f.media_id WHERE f.mrl LIKE 'http://127.0.0.1:8765/%'" 2>&1)
            echo "--- library rows (mrl|last played)"; echo "$rows"
            if echo "$rows" | grep -q '^http://127.0.0.1:8765/saved.mp4|[0-9]'; then ok "the saved stream is in the history"
            else ko "the stream saved with the dialog is not in the library history: the Network list would not show it"; fi
            if echo "$rows" | grep -q '^http://127.0.0.1:8765/played.mp4|[0-9]'; then ok "the played stream is in the history"
            else ko "the stream played from the dialog is not in the library history"; fi
          fi
          a=$(cat shots/net-gets-after-save.txt 2>/dev/null || echo 0)
          c=$(cat shots/net-gets-after-click.txt 2>/dev/null || echo 0)
          echo "requests: $a after Save, $c after the click on the list"
          if [ "${c:-0}" -gt "${a:-0}" ]; then ok "a click on a saved stream plays it"
          else ko "a click on the first row opened no stream (see net-saved.png, net-clicked.png)"; fi
          if grep -q 'GET /played.mp4' shots/net-http.log; then ok "Play in the dialog plays at once"
          else ko "Play in the dialog did not open the stream (see net-dialog.png, net-played.png)"; fi
          exit $fail

      # QML errors do not fail the build: list the warnings the screenshot runs logged (VLC runs at
      # --verbose=1 above, QML warnings are not logged below that). Information only, never fails.
      - name: QML warnings
        if: always()
        run: |
          cat shots/*.log 2>/dev/null | grep -E 'qrc:|\.qml:[0-9]+' | sed -E 's/^\[[^]]*\] //' | sort | uniq -c | sort -rn > qml-warnings.txt || true
          echo "QML warnings: $(wc -l < qml-warnings.txt) distinct"
          cat qml-warnings.txt
          head -40 qml-warnings.txt | while read -r n line; do echo "::warning title=QML warning (x$n)::$line"; done
          cp qml-warnings.txt shots/ 2>/dev/null || true

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: vlc-linux-install
          path: install/
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
