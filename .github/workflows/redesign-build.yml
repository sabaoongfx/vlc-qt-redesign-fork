name: Redesign build

on:
  push:
    branches: [redesign]
  workflow_dispatch:

jobs:
  linux-qt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Same image upstream VLC uses for its debian CI job (has Qt and all build deps).
    container:
      image: registry.videolan.org/vlc-debian-unstable:20260611225331
      # The image's default user can't write the runner's temp dir (EACCES in checkout).
      options: --user root
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: apt-get update -qq && apt-get install -y -qq ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Restore medialibrary contrib cache
        uses: actions/cache@v4
        with:
          path: |
            contrib/native
            contrib/x86_64-linux-gnu
            contrib/tarballs
          key: contrib-medialibrary-${{ hashFiles('contrib/src/medialibrary/**', 'contrib/src/sqlite/**') }}

      - name: Build medialibrary contrib
        run: |
          # The image has no medialibrary; without it VLC builds no Videos/Music library.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd contrib
          mkdir -p native && cd native
          ../bootstrap
          make -j"$(getconf _NPROCESSORS_ONLN)" .medialibrary

      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./bootstrap
          CC="ccache gcc" CXX="ccache g++" ./configure --prefix=$PWD/install --disable-nls

      - name: Build
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install
          ccache -s

      - name: Screenshots, day and night (best effort)
        continue-on-error: true
        run: |
          apt-get install -y -qq imagemagick x11-apps xvfb xdotool
          # VLC refuses to run as root, so run it as an unprivileged user.
          id shotuser >/dev/null 2>&1 || useradd -m shotuser
          mkdir -p shots
          chown -R shotuser "$PWD/shots"
          chmod -R a+rX "$PWD/install"
          cat > /tmp/shot.sh <<'SH'
          # $1 = workspace, $2 = name, $3 = color-scheme-index (0 system, 1 day, 2 night)
          mkdir -p "$HOME/.config/vlc"
          printf '[MainWindow]\ncolor-scheme-index=%s\n' "$3" > "$HOME/.config/vlc/vlc-qt-interface.conf"
          export VLC_PLUGIN_PATH="$1/install/lib/vlc/plugins"
          export QT_QPA_PLATFORM=xcb
          "$1/install/bin/vlc" --no-media-library --no-qt-privacy-ask -I qt >"$1/shots/$2.log" 2>&1 &
          VLC_PID=$!
          sleep 12
          WID=$(xdotool search --onlyvisible --class vlc | head -1)
          xdotool windowmove "$WID" 0 0 windowsize "$WID" 1280 800 || true
          sleep 5
          import -window root "$1/shots/$2.png" || true
          # dialogs: Open Media (Ctrl+O), then Preferences (sidebar button)
          xdotool mousemove 640 400; sleep 0.3; xdotool key ctrl+o; sleep 3
          import -window root "$1/shots/$2-open.png" || true
          xdotool key Escape; sleep 1
          xdotool mousemove 60 764; sleep 0.3; xdotool click 1; sleep 4
          import -window root "$1/shots/$2-prefs.png" || true
          kill $VLC_PID || true
          sleep 2
          SH
          chmod +x /tmp/shot.sh
          for mode in "day 1" "night 2"; do
            set -- $mode
            runuser -u shotuser -- xvfb-run -a -s "-screen 0 1280x800x24" /tmp/shot.sh "$PWD" "$1" "$2"
          done
          ls -la shots

      - name: Player screenshots, day and night (best effort)
        continue-on-error: true
        run: |
          apt-get install -y -qq ffmpeg xdotool
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=854x480:rate=30 -f lavfi -i sine=frequency=440 \
            -t 60 -pix_fmt yuv420p /tmp/test.mp4
          chmod a+r /tmp/test.mp4
          cat > /tmp/shot-player.sh <<'SH'
          # $1 = workspace, $2 = name, $3 = color-scheme-index
          mkdir -p "$HOME/.config/vlc"
          printf '[MainWindow]\ncolor-scheme-index=%s\n' "$3" > "$HOME/.config/vlc/vlc-qt-interface.conf"
          export VLC_PLUGIN_PATH="$1/install/lib/vlc/plugins"
          export QT_QPA_PLATFORM=xcb
          "$1/install/bin/vlc" --no-media-library --no-qt-privacy-ask --aout=dummy /tmp/test.mp4 >"$1/shots/$2.log" 2>&1 &
          VLC_PID=$!
          sleep 12
          xdotool mousemove 700 400; sleep 0.3; xdotool mousemove 760 440; sleep 0.3; xdotool mousemove 800 470; sleep 0.4
          import -window root "$1/shots/$2.png" || true
          # hover an icon button (bottom-left controls) to capture its hover state
          xdotool mousemove 736 770; sleep 0.2; xdotool mousemove 737 771; sleep 0.5
          import -window root "$1/shots/$2-hover.png" || true
          # open the subtitles/tracks menu (bottom-left first icon)
          xdotool mousemove 696 770; sleep 0.3; xdotool click 1; sleep 1.5
          import -window root "$1/shots/$2-tracks.png" || true
          # switch to the Audio tab
          xdotool mousemove 1275 369; sleep 0.3; xdotool click 1; sleep 1
          import -window root "$1/shots/$2-tracks-audio.png" || true
          kill $VLC_PID || true
          sleep 2
          SH
          chmod +x /tmp/shot-player.sh
          for mode in "player-day 1" "player-night 2"; do
            set -- $mode
            runuser -u shotuser -- xvfb-run -a -s "-screen 0 1920x1080x24" /tmp/shot-player.sh "$PWD" "$1" "$2"
          done
          ls -la shots

      - name: Library screenshots, day and night (best effort)
        continue-on-error: true
        run: |
          # Sample media in the XDG Videos/Music dirs; the first-run wizard adds those to the library.
          H=/home/shotuser
          mkdir -p $H/Videos $H/Music $H/.config
          printf 'XDG_VIDEOS_DIR="$HOME/Videos"\nXDG_MUSIC_DIR="$HOME/Music"\n' > $H/.config/user-dirs.dirs
          i=0
          for t in "Night Harbor" "Paper Cities" "The Long Road" "Glass Garden" "Slow Orbit" "Red Station" "Quiet Machines" "Salt and Static"; do
            i=$((i+1))
            ffmpeg -loglevel error -y -f lavfi -i "testsrc2=size=640x360:rate=24" -f lavfi -i "sine=frequency=$((200+i*40))" \
              -t $((20+i*7)) -pix_fmt yuv420p -metadata title="$t" "$H/Videos/$t.mp4"
          done
          n=0
          for artist in "Aurora Lane" "North Coast" "Violet Hours"; do
            for album in "First Light" "Second Wind"; do
              for tr in 1 2 3; do
                n=$((n+1))
                ffmpeg -loglevel error -y -f lavfi -i "sine=frequency=$((220+n*20))" -t 6 -c:a aac \
                  -metadata artist="$artist" -metadata album_artist="$artist" -metadata album="$album" \
                  -metadata title="Track $tr" -metadata track=$tr -metadata genre="Ambient" \
                  "$H/Music/$artist - $album - $tr.m4a"
              done
            done
          done
          chown -R shotuser $H
          mkdir -p shots; chown -R shotuser "$PWD/shots"
          cat > /tmp/shot-lib.sh <<'SH'
          # $1 = workspace
          export VLC_PLUGIN_PATH="$1/install/lib/vlc/plugins"
          export QT_QPA_PLATFORM=xcb
          click() { xdotool mousemove "$1" "$2"; sleep 0.3; xdotool click 1; }
          resize() {
            WID=$(xdotool search --onlyvisible --class vlc | head -1)
            xdotool windowmove "$WID" 0 0 windowsize "$WID" 1280 800 || true
          }
          # Phase A: first run. Click through the wizard (Next, Next, Next, Finish) so it adds the XDG folders, then let it scan.
          rm -rf "$HOME/.config/vlc" "$HOME/.local/share/vlc"
          "$1/install/bin/vlc" -I qt --aout=dummy >"$1/shots/lib-setup.log" 2>&1 &
          PID=$!
          sleep 14
          import -window root "$1/shots/lib-wizard.png" || true
          for k in 1 2 3 4; do click 979 587; sleep 2; done
          sleep 45
          import -window root "$1/shots/lib-after-setup.png" || true
          kill $PID || true; sleep 4
          # Phase B: one launch per theme.
          for mode in "day 1" "night 2"; do
            set -- "$1" $mode
            printf '[MainWindow]\ncolor-scheme-index=%s\n' "$3" > "$HOME/.config/vlc/vlc-qt-interface.conf"
            "$1/install/bin/vlc" -I qt --no-qt-privacy-ask --aout=dummy >"$1/shots/lib-$2.log" 2>&1 &
            PID=$!
            sleep 12; resize; sleep 5
            import -window root "$1/shots/lib-home-$2.png" || true
            click 80 108; sleep 6
            import -window root "$1/shots/lib-video-$2.png" || true
            xdotool mousemove 400 200; sleep 0.3; xdotool mousemove 402 202; sleep 0.6
            import -window root "$1/shots/lib-video-$2-hover.png" || true
            click 80 246; sleep 6 # Music (Video is expanded: All, Playlists)
            import -window root "$1/shots/lib-music-$2.png" || true
            kill $PID || true; sleep 4
          done
          SH
          chmod +x /tmp/shot-lib.sh
          runuser -u shotuser -- xvfb-run -a -s "-screen 0 1280x800x24" /tmp/shot-lib.sh "$PWD"
          ls -la shots

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: vlc-linux-install
          path: install/
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
