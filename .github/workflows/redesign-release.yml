name: Redesign release

# Publishes a GitHub release for a v* tag from the builds every push to redesign already makes
# (a tag run cannot read the redesign branch's caches, so building here would rebuild the Windows
# contribs from scratch). Push the commit, then the tag: this waits for the Windows and Linux
# package runs of the tagged commit, takes their artifacts and attaches them under fixed names
# (no version: the tag has it), so https://github.com/<repo>/releases/latest/download/<name> always
# gives the newest one (the website links those):
#   VLC-juxtopposed-x64-setup.exe, VLC-juxtopposed-x64-portable.zip,
#   VLC-juxtopposed-x86_64.AppImage, VLC-juxtopposed-x86_64.tar.gz
# A v*-something tag (v0.1.0-rc1) or any v0.x is published as a pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the package builds of this commit
        run: |
          set -euo pipefail
          # run id of the newest run of workflow $1 for $SHA (waits for it to appear and finish)
          wait_run() {
            local id=""
            for i in $(seq 1 60); do
              id=$(gh run list --workflow "$1" --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$id" ] && break
              echo "no $1 run for $SHA yet"; sleep 60
            done
            [ -n "$id" ] || { echo "::error::$1 never ran for $SHA (was the commit pushed to redesign?)"; exit 1; }
            gh run watch "$id" --interval 120 --exit-status > /dev/null \
              || { echo "::error::$1 run $id failed"; exit 1; }
            echo "$id"
          }
          WIN=$(wait_run redesign-windows.yml | tail -1)
          LIN=$(wait_run redesign-linux-packages.yml | tail -1)
          gh run download "$WIN" -n vlc-win64-portable -D dl/win
          gh run download "$LIN" -n vlc-linux-packages -D dl/linux
          ls -laR dl

      - name: Name the assets
        run: |
          set -euo pipefail
          V=${TAG#v}
          mkdir out
          # fixed names, no version: /releases/latest/download/<name> never changes (the release tag has the version)
          copy() {
            cp "$1" "out/VLC-juxtopposed-$2"
          }
          copy "$(ls dl/win/*.exe | head -1)" x64-setup.exe
          copy "$(ls dl/win/*.zip | head -1)" x64-portable.zip
          copy dl/linux/VLC-juxtopposed-x86_64.AppImage x86_64.AppImage
          copy dl/linux/VLC-juxtopposed-x86_64.tar.gz x86_64.tar.gz
          (cd out && sha256sum * > SHA256SUMS)
          ls -la out

      - name: Publish
        run: |
          set -euo pipefail
          V=${TAG#v}
          PRE=""
          case "$V" in 0.*|*-*) PRE="--prerelease" ;; esac
          cat > notes.md <<EOF
          VLC media player with the redesigned interface by [Juxtopposed](https://www.youtube.com/@juxtopposed),
          ported to VLC's Qt interface. Unofficial build, not made or endorsed by VideoLAN.

          | Platform | Download |
          |---|---|
          | Windows 10/11 x64 | \`VLC-juxtopposed-x64-setup.exe\` (installer) or \`-x64-portable.zip\` |
          | Linux x86_64 (glibc 2.39+: Ubuntu 24.04, Debian 13, Fedora 40, Arch) | \`VLC-juxtopposed-x86_64.AppImage\` or \`.tar.gz\` |
          | macOS | coming later |

          The Windows builds are not code-signed: SmartScreen asks for confirmation (More info, Run anyway).
          It installs next to VideoLAN's VLC and shares its settings folder.

          Website: https://vlc.sabaoon.dev
          EOF
          gh release create "$TAG" out/* --verify-tag $PRE \
            --title "VLC (juxtopposed) $TAG" --notes-file notes.md
